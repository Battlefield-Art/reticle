# Renders the "Sponsor" button on the repo and in the sidebar.
#
# `github` points at the user account, not the org: `reticlehq` has no GitHub Sponsors
# listing, so an org entry here would render a button that goes nowhere.
#
# Only the platforms actually in use are listed. The rest of GitHub's template is
# commented-out placeholders; see https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
# for the full set if another one is ever added.

github: [divshekhar]
custom: ['https://paypal.me/dshekhar17']
