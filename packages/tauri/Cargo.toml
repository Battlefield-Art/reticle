[package]
name = "reticle-tauri"
version = "0.1.0"
edition = "2021"
description = "Reticle screenshots and headless mode for a Tauri app"
license = "MIT"

[dependencies]
tauri = "2"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSData",
  "NSDictionary",
  "NSString",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }
